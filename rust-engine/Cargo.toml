[package]
name = "under-center-engine"
version = "0.1.0"
edition = "2021"
description = "Under Center Identity & NIL Engine — cryptographic identity, compliance, ranking, and deal infrastructure"
authors = ["FTH Trading <engineering@undercenter.com>"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["json", "macros"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# Cryptography
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"

# HTTP client (scraping)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"

# HMAC validation
hmac = "0.12"

# Rate limiting
governor = "0.8"

[dev-dependencies]
tokio-test = "0.4"
