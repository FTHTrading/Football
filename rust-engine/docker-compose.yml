version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uc_engine
      POSTGRES_PASSWORD: password
      POSTGRES_DB: uc_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uc_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  engine:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://uc_engine:password@db:5432/uc_engine
      HMAC_SECRET: dev-secret-change-in-production
      SIGNING_KEY_PATH: ./keys/signing.key
      CORS_ORIGIN: http://localhost:3000
      RUST_LOG: uc_engine=debug,tower_http=debug
    ports:
      - "8080:8080"

volumes:
  pgdata:
